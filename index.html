<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOID ECHO — RPG</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050509;color:#fff;font-family:monospace;overflow:hidden}
#game{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{width:min(96vw,960px);height:auto;max-height:90vh;background:#08080d;border:2px solid #333;image-rendering:pixelated}
#hint{position:fixed;bottom:5px;left:0;right:0;text-align:center;color:#aaa;font-size:12px}
</style>
</head>
<body>
<div id="game"><canvas id="c" width="800" height="500"></canvas></div>
<div id="hint">WASD / стрелки — движение • Z/Enter — действие • I — инвентарь • P — сохранить</div>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
ctx.imageSmoothingEnabled=false;

let state="title",room=0,hp=24,maxhp=24,kills=0,spared=0,gold=0;
let genocide=false,ending="",bossStarted=false;
let player={x:110,y:390,r:10,s:3};
let dialog=[],di=0,battle=null;
let inventory=["Малое лечение","Старая записка"];
let flags={metGuide:false,crystal:false,archive:false};
const saveKey="void_echo_save_v3";

const rooms=[
 {name:"Пепельный двор",bg:"#15131c"},
 {name:"Стеклянные пещеры",bg:"#101b25"},
 {name:"Заброшенный архив",bg:"#1b1712"},
 {name:"Чёрный коридор",bg:"#09090d"}
];
const enemies=[
 {name:"Морок",hp:18,max:18,desc:"Тень, которая притворяется дверью."},
 {name:"Кристалл-рыцарь",hp:26,max:26,desc:"Живой осколок древнего механизма."},
 {name:"Архивный жук",hp:32,max:32,desc:"Существо, пожирающее забытые страницы."}
];

function say(t){dialog=[t];di=0;state="dialog"}
function next(){if(di<dialog.length-1)di++;else{dialog=[];state="world"}}
function wrap(t,x,y,w,lh=22){
 let words=t.split(" "),line="",yy=y;
 for(const word of words){
  const test=line?line+" "+word:word;
  if(ctx.measureText(test).width>w){ctx.fillText(line,x,yy);line=word;yy+=lh}
  else line=test;
 }
 if(line)ctx.fillText(line,x,yy);
}
function addItem(x){if(!inventory.includes(x))inventory.push(x)}
function removeItem(x){const i=inventory.indexOf(x);if(i>=0)inventory.splice(i,1)}

function saveGame(){
 localStorage.setItem(saveKey,JSON.stringify({
  room,hp,maxhp,kills,spared,gold,genocide,ending,player,inventory,flags
 }));
 say("Игра сохранена.");
}
function loadGame(){
 const raw=localStorage.getItem(saveKey);
 if(!raw){say("Сохранения пока нет.");return}
 try{
  const d=JSON.parse(raw);
  room=d.room??0;hp=d.hp??24;maxhp=d.maxhp??24;kills=d.kills??0;
  spared=d.spared??0;gold=d.gold??0;genocide=!!d.genocide;
  ending=d.ending||"";player=d.player||player;inventory=d.inventory||inventory;
  flags=d.flags||flags;state="world";
 }catch(e){say("Сохранение повреждено.")}
}

function title(){
 ctx.fillStyle="#050509";ctx.fillRect(0,0,800,500);
 ctx.textAlign="center";ctx.fillStyle="#fff";
 ctx.font="bold 44px monospace";ctx.fillText("VOID ECHO",400,170);
 ctx.font="18px monospace";ctx.fillStyle="#aaa";ctx.fillText("оригинальная пиксельная RPG",400,205);
 ctx.fillStyle="#fff";ctx.fillText("Z / ENTER — начать",400,280);
 ctx.fillStyle="#888";ctx.font="14px monospace";ctx.fillText("L — загрузить сохранение",400,310);
 ctx.textAlign="left";
}
function world(){
 const r=rooms[room];
 ctx.fillStyle=r.bg;ctx.fillRect(0,0,800,500);
 ctx.fillStyle="#222231";
 for(let i=0;i<10;i++)ctx.fillRect(i*90,70+(i%2)*15,55,180);
 ctx.fillStyle="#343445";ctx.fillRect(0,420,800,80);
 ctx.fillStyle="#11111a";ctx.fillRect(35,55,730,365);
 ctx.strokeStyle="#55556b";ctx.strokeRect(35,55,730,365);
 if(room<3){ctx.fillStyle="#777";ctx.fillRect(735,205,30,80)}
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
 ctx.font="18px monospace";ctx.fillText(r.name,55,35);
 ctx.font="14px monospace";ctx.fillStyle="#bbb";
 ctx.fillText("HP "+hp+"/"+maxhp+"   Убийств: "+kills+"   Монет: "+gold,55,475);
 if(genocide){ctx.fillStyle="#d66";ctx.fillText("МАРШРУТ: ГЕНОЦИД",575,35)}
}
function dialogDraw(){
 world();
 ctx.fillStyle="rgba(0,0,0,.9)";ctx.fillRect(45,330,710,125);
 ctx.strokeStyle="#fff";ctx.strokeRect(45,330,710,125);
 ctx.fillStyle="#fff";ctx.font="18px monospace";wrap(dialog[di],70,365,660);
 ctx.font="13px monospace";ctx.fillStyle="#aaa";ctx.fillText("Z / ENTER — продолжить",560,435);
}
function inventoryDraw(){
 ctx.fillStyle="#050509";ctx.fillRect(0,0,800,500);
 ctx.fillStyle="#fff";ctx.font="28px monospace";ctx.fillText("ИНВЕНТАРЬ",55,60);
 ctx.font="16px monospace";
 inventory.forEach((it,i)=>{
  ctx.fillStyle=i===0?"#fff":"#aaa";
  ctx.fillText((i===0?"> ":"  ")+it,70,120+i*38);
 });
 ctx.fillStyle="#aaa";ctx.font="13px monospace";
 ctx.fillText("Z — использовать первый предмет • I/X/Esc — выйти",55,430);
 ctx.fillText("Монеты: "+gold,600,60);
}
function battleDraw(){
 ctx.fillStyle="#050509";ctx.fillRect(0,0,800,500);
 ctx.fillStyle="#fff";ctx.font="26px monospace";ctx.fillText(battle.enemy.name,70,55);
 ctx.font="15px monospace";ctx.fillStyle="#bbb";ctx.fillText(battle.enemy.desc,70,82);
 ctx.strokeStyle="#fff";ctx.strokeRect(210,130,380,250);
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(battle.soul.x,battle.soul.y,7,0,Math.PI*2);ctx.fill();
 for(const b of battle.bullets){ctx.fillRect(b.x,b.y,b.w,b.h)}
 ctx.font="16px monospace";ctx.fillText("HP "+hp+"/"+maxhp,70,430);
 ctx.fillText("Z — атака   X — пощада   H — лечение",395,430);
}
function endingDraw(){
 ctx.fillStyle="#030306";ctx.fillRect(0,0,800,500);
 ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="30px monospace";
 const title={
  "МИРНАЯ":"КОНЦОВКА: ТИХИЙ СВЕТ",
  "ОБЫЧНАЯ":"КОНЦОВКА: ВОЗВРАЩЕНИЕ",
  "ГЕНОЦИД":"КОНЦОВКА: ПУСТОТА",
  "ИСТИННАЯ":"КОНЦОВКА: ИСТИННОЕ ЭХО"
 }[ending]||"КОНЦОВКА";
 ctx.fillText(title,400,150);
 ctx.font="17px monospace";ctx.fillStyle="#bbb";
 const desc={
  "МИРНАЯ":"Ты пощадил врагов. Мир получил шанс восстановиться.",
  "ОБЫЧНАЯ":"Ты прошёл путь до конца и нашёл дорогу домой.",
  "ГЕНОЦИД":"Ты уничтожил всё на своём пути. Архитектор Пустоты проснулся.",
  "ИСТИННАЯ":"Ты сохранил Эхо и остановил Пустоту без разрушения мира."
 }[ending];
 wrap(desc,170,215,460,27);
 ctx.fillStyle="#aaa";ctx.fillText("Z / ENTER — начать заново",400,350);
 ctx.textAlign="left";
}

function startBattle(e,final=false){
 battle={enemy:{...e},final,phase:"menu",soul:{x:400,y:255},bullets:[],timer:0};
 state="battle";
}
function enemyTurn(){
 battle.phase="dodge";battle.timer=0;battle.bullets=[];
 for(let i=0;i<7;i++)battle.bullets.push({
  x:220+i*48,y:145,w:8,h:8,
  dx:(i%2?1:-1)*(1.2+i*.08),dy:1.2+(i%3)*.4
 });
}
function attack(){
 if(!battle)return;
 const dmg=battle.final?12:8;
 battle.enemy.hp-=dmg;
 if(battle.enemy.hp<=0){
  if(battle.final){
   ending=genocide?"ГЕНОЦИД":"ИСТИННАЯ";state="ending";return;
  }
  kills++;
  genocide=true;
  addItem("Осколок Эха");
  say("Ты победил врага. После этого пути назад почти нет.");
  return;
 }
 enemyTurn();
}
function spare(){
 if(battle.final){say("Архитектор не принимает пощаду.");return}
 spared++;battle=null;state="world";
 say("Ты пощадил врага. Твой выбор изменил историю.");
}
function heal(){
 if(!inventory.includes("Малое лечение")){say("Лечебных предметов нет.");return}
 if(hp>=maxhp){say("HP уже полностью восстановлены.");return}
 removeItem("Малое лечение");hp=Math.min(maxhp,hp+10);enemyTurn();
}
function corridorSequence(){
 state="cutscene";let t=0;
 const iv=setInterval(()=>{
  t++;ctx.fillStyle="#000";ctx.fillRect(0,0,800,500);
  ctx.textAlign="center";ctx.font="24px monospace";ctx.fillStyle="#fff";
  if(t<50)ctx.fillText("КОРИДОР",400,220);
  else if(t<100)ctx.fillText("Кто-то уже ждал тебя.",400,220);
  else if(t<160){
   ctx.fillStyle="#9ff";ctx.fillRect(80,220,640,18);
   ctx.fillStyle="#fff";ctx.fillText("СИНИЙ ЛАЗЕР",400,190);
  }else{
   clearInterval(iv);
   startBattle({name:"АРХИТЕКТ ПУСТОТЫ",hp:70,max:70,atk:8,
    desc:"Главный босс. Настоящий бой начинается сейчас."},true);
  }
  ctx.textAlign="left";
 },45);
}
function story(){
 if(room===0&&!flags.metGuide&&player.x>250&&player.x<430&&player.y>180&&player.y<300){
  flags.metGuide=true;
  addItem("Кристальный осколок");
  dialog=[
   "Незнакомец: Ты не должен был сюда попасть.",
   "Незнакомец: Этот мир держится на четырёх Эхо.",
   "Незнакомец: Если Пустота проснётся, она поглотит воспоминания.",
   "Незнакомец: Выборы будут иметь значение."
  ];di=0;state="dialog";
 }
 if(room===1&&!flags.crystal&&player.x>500&&player.y<180){
  flags.crystal=true;addItem("Старый ключ");
  say("Ты открыл древний механизм и получил Старый ключ.");
 }
 if(room===2&&!flags.archive&&player.x<260&&player.y<170){
  flags.archive=true;addItem("Чернильная страница");
  say("В архиве написано: Архитектор создал Пустоту, чтобы сохранить мир.");
 }
}

function updateBattle(){
 if(!battle||battle.phase!=="dodge")return;
 battle.timer++;
 for(const b of battle.bullets){
  b.x+=b.dx;b.y+=b.dy;
  if(b.x<215||b.x>580)b.dx*=-1;
  if(b.y>370)b.y=140;
 }
 for(const b of battle.bullets){
  if(Math.abs(b.x-battle.soul.x)<12&&Math.abs(b.y-battle.soul.y)<12){
   hp--;b.x=-100;
   if(hp<=0){state="gameover";return}
  }
 }
 if(battle.timer>150){battle.phase="menu";battle.bullets=[]}
}

function update(){
 if(state==="world"){
  const k=window.__keys||{};
  if(k.ArrowUp||k.w)player.y-=player.s;
  if(k.ArrowDown||k.s)player.y+=player.s;
  if(k.ArrowLeft||k.a)player.x-=player.s;
  if(k.ArrowRight||k.d)player.x+=player.s;
  player.x=Math.max(48,Math.min(752,player.x));
  player.y=Math.max(70,Math.min(405,player.y));

  if(player.x>720&&room<3){
   room++;player.x=70;
   say(["Стеклянные пещеры. Кристаллы хранят чужие воспоминания.",
        "Заброшенный архив. Здесь слишком тихо.",
        "Чёрный коридор. Весь путь вёл сюда."][room-1]);
  }
  if(room===1&&!window.met1&&player.x>330&&player.x<500&&player.y>180&&player.y<300){
   window.met1=true;startBattle(enemies[0]);
  }
  if(room===2&&!window.met2&&player.x>500&&player.y>300){
   window.met2=true;startBattle(enemies[1]);
  }
  story();

  if(room===3&&!bossStarted&&player.x>350&&player.y<170){
   bossStarted=true;
   if(genocide){
    corridorSequence();
   }else if(spared>=1){
    ending="МИРНАЯ";state="ending";
   }else{
    ending="ОБЫЧНАЯ";state="ending";
   }
  }
 }
 if(state==="battle")updateBattle();
}

function draw(){
 if(state==="title")title();
 else if(state==="world")world();
 else if(state==="dialog")dialogDraw();
 else if(state==="inventory")inventoryDraw();
 else if(state==="battle")battleDraw();
 else if(state==="ending")endingDraw();
 else if(state==="cutscene"){}
 else if(state==="gameover"){
  ctx.fillStyle="#000";ctx.fillRect(0,0,800,500);
  ctx.fillStyle="#fff";ctx.font="30px monospace";ctx.fillText("ТЫ ПАЛ",330,230);
  ctx.font="16px monospace";ctx.fillText("Z — начать заново",300,270);
 }
}

window.__keys={};
addEventListener("keydown",e=>{
 window.__keys[e.key]=true;

 if(state==="title"&&(e.key==="z"||e.key==="Enter")){
  state="world";
  say("Ты просыпаешься в Пепельном дворе. Впереди неизвестный путь.");
 }
 else if(state==="dialog"&&(e.key==="z"||e.key==="Enter"))next();
 else if(state==="world"&&(e.key==="i"||e.key==="I"))state="inventory";
 else if(state==="inventory"&&(e.key==="i"||e.key==="I"||e.key==="x"||e.key==="Escape"))state="world";
 else if(state==="inventory"&&(e.key==="z"||e.key==="Enter")){
  if(inventory.includes("Малое лечение")&&hp<maxhp){
   removeItem("Малое лечение");hp=Math.min(maxhp,hp+10);say("Ты использовал Малое лечение. +10 HP.");
  }else say("Этот предмет сейчас использовать нельзя.");
 }
 else if(state==="world"&&(e.key==="p"||e.key==="P"))saveGame();
 else if(state==="title"&&(e.key==="l"||e.key==="L"))loadGame();
 else if(state==="battle"&&battle&&battle.phase==="menu"&&(e.key==="z"||e.key==="Enter"))attack();
 else if(state==="battle"&&battle&&battle.phase==="menu"&&(e.key==="x"||e.key==="Escape"))spare();
 else if(state==="battle"&&battle&&battle.phase==="menu"&&(e.key==="h"||e.key==="H"))heal();
 else if(state==="battle"&&battle&&battle.phase==="dodge"){
  if(e.key==="ArrowUp"||e.key==="w")battle.soul.y-=12;
  if(e.key==="ArrowDown"||e.key==="s")battle.soul.y+=12;
  if(e.key==="ArrowLeft"||e.key==="a")battle.soul.x-=12;
  if(e.key==="ArrowRight"||e.key==="d")battle.soul.x+=12;
  battle.soul.x=Math.max(220,Math.min(580,battle.soul.x));
  battle.soul.y=Math.max(140,Math.min(370,battle.soul.y));
 }
 else if(state==="gameover"&&(e.key==="z"||e.key==="Enter"))location.reload();
 else if(state==="ending"&&(e.key==="z"||e.key==="Enter"))location.reload();
});
addEventListener("keyup",e=>delete window.__keys[e.key]);

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
