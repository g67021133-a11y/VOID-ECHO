<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ничего подозрительного 👀</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000}
#sound{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
padding:18px 28px;border:0;border-radius:14px;background:#ff1744;color:white;
font:bold 20px Arial;cursor:pointer;box-shadow:0 8px 35px #000;z-index:2}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
color:#aaa;font:14px Arial;z-index:2}
</style>
</head>
<body>
<video id="video" autoplay muted playsinline loop>
  <source src="1000002257.mp4" type="video/mp4">
</video>
<button id="sound">🔊 ВКЛЮЧИТЬ ЗВУК</button>
<div id="hint">Нажми кнопку — и всё станет понятно 😏</div>
<script>
const v=document.getElementById('video'), b=document.getElementById('sound'), h=document.getElementById('hint');
b.onclick=async()=>{
  v.muted=false;
  try{await v.play();}catch(e){}
  b.style.display='none'; h.style.display='none';
};
v.play().catch(()=>{});
</script>
</body>
</html>
